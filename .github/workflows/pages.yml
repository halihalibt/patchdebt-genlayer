name: Test, Build and Deploy PatchDebt
on:
  push:
    branches: [main]
    paths: ['index.html', 'src/**', 'assets/**', 'examples/**', 'package*.json', 'build.mjs', 'deployment.json', 'intelligent-contract/**', 'scripts/**', 'tests/**', 'SOURCE_SHA256.txt', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: patchdebt-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run check:source
      - run: npm test
      - run: python -m unittest discover -s intelligent-contract/tests -v
      - run: npm run build
      - name: Record exact build identity
        run: |
          node --input-type=module -e "import fs from 'node:fs';fs.writeFileSync('dist/release.json',JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,built_at:new Date().toISOString()}))"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (repository must enable Actions as source)
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
